sonar.projectKey=tt-tool
sonar.projectName=tt tool
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=.
sonar.tests=tests
sonar.inclusions=**/*.py,**/*.ps1,**/*.iss,**/*.bat,**/*.json,**/*.properties,**/*.yml,**/*.yaml
sonar.exclusions=tests/**,.build-cache/**,.venv/**,dist/**,logs/**,work/**,**/__pycache__/**
sonar.test.inclusions=tests/**/*.py
